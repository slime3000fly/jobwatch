services:
  web:
    image: ghcr.io/slime3000fly/jobwatch:latest
    restart: unless-stopped
    environment:
      JOBWATCH_INVITE: "${JOBWATCH_INVITE:?ustaw kod zaproszenia w .env}"
      # Klucz szyfrujacy profile/CV w bazie. Zgubisz go = stracisz wszystkie CV.
      JOBWATCH_DB_KEY: "${JOBWATCH_DB_KEY:?ustaw klucz bazy w .env - patrz env.example}"
      JOBWATCH_DATA: /data
      TZ: Europe/Warsaw
    volumes:
      - jobwatch-data:/data
    ports:
      - "8000:8000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        # przycisk "Pobierz oferty" odpala caly pipeline w tym kontenerze
        limits: { memory: 768M }

volumes:
  jobwatch-data:
