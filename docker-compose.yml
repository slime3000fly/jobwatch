services:
  web:
    image: ghcr.io/slime3000fly/jobwatch:latest
    restart: unless-stopped
    environment:
      JOBWATCH_INVITE: "${JOBWATCH_INVITE:?ustaw kod zaproszenia w .env}"
      JOBWATCH_DATA: /data
      TZ: Europe/Warsaw
    volumes:
      - jobwatch-data:/data
    ports:
      # Tylko localhost. Na zewnatrz wystawia nginx - patrz DEPLOY.md.
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        # przycisk "Pobierz oferty" odpala caly pipeline w tym kontenerze
        limits: { memory: 768M }

volumes:
  jobwatch-data:
